# Railway Deployment Configuration - Backend with Ollama Support
# This configuration deploys the backend with integrated Ollama service

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "/app/start_with_ollama.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PORT = { default = "8000" }
PYTHONPATH = { default = "/app" }
NODE_ENV = { default = "production" }
FLASK_ENV = { default = "production" }
OLLAMA_HOST = { default = "0.0.0.0:11434" }
OLLAMA_ORIGINS = { default = "*" }
OLLAMA_MODEL = { default = "qwen2.5:7b" }
